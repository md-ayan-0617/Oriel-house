  <!-- Weighted Brass Base with tactile touch dial -->
  <rect x="460" y="690" width="280" height="110" rx="16" fill="#B88842"/>
  <circle cx="600" cy="745" r="18" fill="#F2C679"/>

  <text x="60" y="1140" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#9C8E7F" letter-spacing="2">
    ISLA CORDLESS PORTABLE // TACTILE ROTARY DIMMER ACTIVE
  </text>
</svg>