<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="solBg" cx="50%" cy="40%" r="65%">
         <stop offset="0%" stop-color="#2D2A35"/>
         <stop offset="60%" stop-color="#1B1921"/>
         <stop offset="100%" stop-color="#100F14"/>
       </radialGradient>
    <filter id="solBlur"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#solBg)"/>
  
    <circle cx="380" cy="480" r="140" fill="#FFF2D6" opacity="0.8" filter="url(#solBlur)"/>
    <circle cx="820" cy="540" r="140" fill="#FFF2D6" opacity="0.8" filter="url(#solBlur)"/>
    <circle cx="600" cy="380" r="160" fill="#FFF2D6" opacity="0.85" filter="url(#solBlur)"/>
  

  <!-- Ceiling Drop Stem -->
  <line x1="600" y1="0" x2="600" y2="340" stroke="#D4A35B" stroke-width="8"/>

  <!-- Mobile Kinetic Arms -->
  <line x1="320" y1="460" x2="880" y2="380" stroke="#C8984D" stroke-width="6"/>
  <line x1="420" y1="360" x2="780" y2="520" stroke="#C8984D" stroke-width="6"/>

  <!-- Orbs -->
  <circle cx="340" cy="460" r="50" fill="#FFF9EE" stroke="#E8C988" stroke-width="3"/>
  <circle cx="860" cy="380" r="50" fill="#FFF9EE" stroke="#E8C988" stroke-width="3"/>
  <circle cx="760" cy="520" r="50" fill="#FFF9EE" stroke="#E8C988" stroke-width="3"/>

  <!-- Counterweights -->
  <circle cx="440" cy="360" r="22" fill="#F2C679"/>

  <text x="60" y="1140" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#9B96A8" letter-spacing="2">
    SOLENNE MOBILE CHANDELIER // THREE-TIER KINETIC HARMONY
  </text>
</svg>