<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="tableBg" x1="0%" y1="0%" x2="100%" y2="100%">
         <stop offset="0%" stop-color="#F6F1E9"/>
         <stop offset="100%" stop-color="#E7DDCF"/>
       </linearGradient>
    <filter id="tableGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="margoShadow">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#8A7B6B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#tableBg)"/>

  <!-- Wooden Table Horizon Line -->
  <rect x="0" y="930" width="1200" height="270" fill="#695345"/>
  <line x1="0" y1="930" x2="1200" y2="930" stroke="#8B7262" stroke-width="4"/>

  

  <!-- MARGO TABLE LAMP -->
  <!-- Honed Travertine / Marble Plinth -->
  <rect x="460" y="880" width="280" height="60" rx="8" fill="#C7BAA7" filter="url(#margoShadow)"/>
  
  <!-- Turned Aged Brass Stem -->
  <rect x="580" y="660" width="40" height="220" fill="#A67A43" filter="url(#margoShadow)"/>
  <ellipse cx="600" cy="740" rx="55" ry="15" fill="#8F6633"/>

  <!-- Mouth-Blown Opal Glass Mushroom Dome -->
  <path d="M 320 540 C 320 330 440 280 600 280 C 760 280 880 330 880 540 C 880 580 820 620 600 620 C 380 620 320 580 320 540 Z" 
        fill="#EDE6DA" 
        stroke="#D0C3B0" 
        stroke-width="4" 
        filter="url(#margoShadow)"/>

  <!-- Brass Finial Cap -->
  <circle cx="600" cy="275" r="22" fill="#946E3A"/>
  <rect x="594" y="250" width="12" height="25" rx="4" fill="#855E2B"/>

  <text x="60" y="1140" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#8C8072" letter-spacing="2">
    MARGO TABLE LAMP // AGED BRASS & HONED STONE
  </text>
</svg>